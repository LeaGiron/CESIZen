name: CI CESIZen

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  web:
    name: Vérification application web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CESIZen-Web

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: Analyse statique du code
        run: npm run lint --if-present

      - name: Exécution des tests automatisés
        run: npm test --if-present

      - name: Génération du build
        run: npm run build --if-present

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high
        continue-on-error: true

  mobile:
    name: Vérification application mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CESIZen-Mobile

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm install --legacy-peer-deps

      - name: Analyse statique du code
        run: npm run lint --if-present

      - name: Exécution des tests automatisés
        run: npm test --if-present

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high
        continue-on-error: true