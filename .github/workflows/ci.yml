name: CI CESIZen

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  web:
    name: Vérification application web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CESIZen-Web

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CESIZen-Web/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification qualité du code
        run: npm run lint
        continue-on-error: true

      - name: Lancement des tests
        run: npm test
        continue-on-error: true

      - name: Build de l'application web
        run: npm run build

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high
        continue-on-error: true

  mobile:
    name: Vérification application mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CESIZen-Mobile

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CESIZen-Mobile/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification qualité du code
        run: npm run lint
        continue-on-error: true

      - name: Lancement des tests
        run: npm test
        continue-on-error: true

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high
        continue-on-error: true