services:
  web:
    build:
      context: ./CESIZen-Web
      dockerfile: Dockerfile
    container_name: cesizen-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./CESIZen-Web:/app
      - /app/node_modules
    networks:
      - cesizen-network

  mobile:
    build:
      context: ./CESIZen-Mobile
      dockerfile: Dockerfile
    container_name: cesizen-mobile
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./CESIZen-Mobile:/app
      - /app/node_modules
    networks:
      - cesizen-network

  sonarqube:
    image: sonarqube:community
    container_name: cesizen-sonarqube
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - cesizen-network

  sonarqube-db:
    image: postgres:15
    container_name: cesizen-sonarqube-db
    environment:
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    networks:
      - cesizen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:

networks:
  cesizen-network:
    driver: bridge
